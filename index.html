<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميجامان - محارب النت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #2a0a1e 100%);
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            color: #00ffff;
            font-size: 20px;
            text-shadow: 0 0 10px #00ffff;
        }

        #healthBar {
            position: absolute;
            top: 70px;
            left: 20px;
            width: 200px;
            height: 20px;
            border: 2px solid #00ffff;
            background: rgba(0,0,0,0.5);
            z-index: 10;
        }

        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00);
            transition: width 0.3s;
            box-shadow: 0 0 10px #00ff00;
        }

        #energyBar {
            position: absolute;
            top: 100px;
            left: 20px;
            width: 200px;
            height: 15px;
            border: 2px solid #ffff00;
            background: rgba(0,0,0,0.5);
            z-index: 10;
        }

        #energyFill {
            height: 100%;
            background: linear-gradient(90deg, #0000ff, #00ffff);
            transition: width 0.3s;
            box-shadow: 0 0 10px #00ffff;
        }

        #startScreen, #gameOverScreen, #levelCompleteScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            color: #00ffff;
            text-align: center;
        }

        #gameOverScreen, #levelCompleteScreen {
            display: none;
        }

        .title {
            font-size: 60px;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            margin-bottom: 20px;
            animation: glow 2s infinite;
        }

        .subtitle {
            font-size: 24px;
            color: #00ffff;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff;
        }

        @keyframes glow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: none;
            color: #000;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 0 20px #ff00ff;
            transition: all 0.3s;
            margin: 10px;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px #ff00ff, 0 0 40px #00ffff;
        }

        .instructions {
            color: #ffff00;
            font-size: 16px;
            margin-top: 30px;
            line-height: 1.8;
            text-shadow: 0 0 5px #ffff00;
        }

        #mobileControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .mobileBtn {
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
            border-radius: 50%;
            color: #00ffff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00ffff;
            touch-action: none;
        }

        .controlGroup {
            display: flex;
            gap: 10px;
        }

        .attackBtn {
            background: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff;
            color: #ff00ff;
        }

        .jumpBtn {
            background: rgba(255, 255, 0, 0.3);
            border-color: #ffff00;
            box-shadow: 0 0 15px #ffff00;
            color: #ffff00;
        }

        .finalScore {
            font-size: 40px;
            color: #ffff00;
            margin: 20px 0;
            text-shadow: 0 0 15px #ffff00;
        }

        @media (max-width: 768px) {
            #mobileControls { display: flex; }
            .title { font-size: 40px; }
            .subtitle { font-size: 18px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="score">النقاط: 0</div>
        <div id="level">المرحلة: 1</div>
    </div>
    
    <div id="healthBar">
        <div id="healthFill" style="width: 100%"></div>
    </div>
    
    <div id="energyBar">
        <div id="energyFill" style="width: 100%"></div>
    </div>
    
    <div id="startScreen">
        <div class="title">⚡ ميجامان ⚡</div>
        <div class="subtitle">محارب النت الأسطوري</div>
        <button class="btn" onclick="startGame()">ابدأ المعركة</button>
        <div class="instructions">
            🖥️ لوحة المفاتيح: الأسهم للحركة | مسافة للقفز<br>
            Z للهجوم | X للهجوم الخاص<br>
            📱 الجوال: الأزرار على الشاشة
        </div>
    </div>
    
    <div id="gameOverScreen">
        <div class="title" style="color: #ff0000;">💀 هُزمت 💀</div>
        <div class="finalScore" id="finalScore">النقاط: 0</div>
        <button class="btn" onclick="restartGame()">حاول مجدداً</button>
    </div>
    
    <div id="levelCompleteScreen">
        <div class="title" style="color: #00ff00;">✨ انتصار! ✨</div>
        <div class="subtitle">أكملت المرحلة بنجاح!</div>
        <button class="btn" onclick="nextLevel()">المرحلة التالية</button>
    </div>
    
    <div id="mobileControls">
        <div class="controlGroup">
            <div class="mobileBtn" id="leftBtn">◀</div>
            <div class="mobileBtn" id="rightBtn">▶</div>
        </div>
        <div class="controlGroup">
            <div class="mobileBtn jumpBtn" id="jumpBtn">⬆</div>
            <div class="mobileBtn attackBtn" id="attackBtn">⚔</div>
            <div class="mobileBtn attackBtn" id="specialBtn">✦</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let gameState = 'start';
        let score = 0;
        let level = 1;
        let lives = 3;
        let cameraX = 0;
        let lastTime = 0;

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, duration, type = 'square', volume = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = freq;
            osc.type = type;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function attackSound() {
            playSound(200, 0.1, 'sawtooth', 0.15);
            playSound(400, 0.05, 'square', 0.1);
        }

        function jumpSound() {
            playSound(300, 0.2, 'sine', 0.1);
        }

        function hitSound() {
            playSound(100, 0.3, 'sawtooth', 0.2);
        }

        function specialSound() {
            playSound(500, 0.5, 'sine', 0.15);
            setTimeout(() => playSound(700, 0.3, 'sine', 0.15), 100);
        }

        // Player
        const player = {
            x: 100,
            y: 0,
            width: 50,
            height: 70,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: 15,
            onGround: false,
            health: 100,
            maxHealth: 100,
            energy: 100,
            maxEnergy: 100,
            facing: 1,
            attacking: false,
            attackTimer: 0,
            specialAttacking: false,
            specialTimer: 0,
            invincible: false,
            invincibleTimer: 0,
            animFrame: 0,
            animTimer: 0,
            doubleJump: true,
            hasDoubleJumped: false,
            dashTimer: 0
        };

        // Platforms
        const platforms = [];
        const enemies = [];
        const projectiles = [];
        const particles = [];
        const powerups = [];
        let keys = {};

        function generateLevel() {
            platforms.length = 0;
            enemies.length = 0;
            projectiles.length = 0;
            particles.length = 0;
            powerups.length = 0;

            const levelLength = 2000 + level * 500;
            
            // Ground
            platforms.push({
                x: 0,
                y: canvas.height - 50,
                width: levelLength,
                height: 50,
                type: 'ground',
                color: '#4a0080'
            });

            // Random platforms
            for (let i = 0; i < 15 + level * 3; i++) {
                platforms.push({
                    x: 200 + i * (150 + Math.random() * 100),
                    y: canvas.height - 150 - Math.random() * 200,
                    width: 100 + Math.random() * 150,
                    height: 20,
                    type: 'platform',
                    color: '#800040'
                });
            }

            // Enemies
            for (let i = 0; i < 5 + level * 2; i++) {
                spawnEnemy(300 + i * (250 + Math.random() * 200));
            }

            // Power-ups
            for (let i = 0; i < 3 + level; i++) {
                spawnPowerup(400 + i * 400);
            }
        }

        function spawnEnemy(x) {
            const types = ['robot', 'virus', 'firewall', 'trojan'];
            const type = types[Math.floor(Math.random() * types.length)];
            const enemyTypes = {
                robot: { health: 30 + level * 10, speed: 1.5, color: '#888888', size: 50, damage: 10 },
                virus: { health: 20 + level * 5, speed: 2.5, color: '#00ff00', size: 40, damage: 8 },
                firewall: { health: 50 + level * 15, speed: 0.8, color: '#ff4400', size: 60, damage: 15 },
                trojan: { health: 40 + level * 12, speed: 1.2, color: '#aa00aa', size: 55, damage: 12 }
            };
            const data = enemyTypes[type];
            enemies.push({
                x: x,
                y: canvas.height - 50 - data.size,
                width: data.size,
                height: data.size,
                vx: data.speed * (Math.random() < 0.5 ? -1 : 1),
                health: data.health,
                maxHealth: data.health,
                color: data.color,
                damage: data.damage,
                type: type,
                onGround: true,
                attackTimer: 0,
                animFrame: 0,
                animTimer: 0
            });
        }

        function spawnPowerup(x) {
            const types = ['health', 'energy', 'life'];
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: x,
                y: canvas.height - 200 - Math.random() * 100,
                width: 30,
                height: 30,
                type: type,
                collected: false,
                bobTimer: 0
            });
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameState = 'playing';
            score = 0;
            level = 1;
            lives = 3;
            player.health = player.maxHealth;
            player.energy = player.maxEnergy;
            player.x = 100;
            player.y = canvas.height - 200;
            generateLevel();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }

        function nextLevel() {
            document.getElementById('levelCompleteScreen').style.display = 'none';
            level++;
            player.health = player.maxHealth;
            player.energy = player.maxEnergy;
            player.x = 100;
            cameraX = 0;
            generateLevel();
            gameState = 'playing';
        }

        function gameOver() {
            gameState = 'gameover';
            document.getElementById('finalScore').textContent = `النقاط: ${score}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
        }

        function levelComplete() {
            gameState = 'complete';
            score += level * 500;
            document.getElementById('levelCompleteScreen').style.display = 'flex';
        }

        // Input
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Mobile controls
        function setupMobileBtn(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }
        setupMobileBtn('leftBtn', 'ArrowLeft');
        setupMobileBtn('rightBtn', 'ArrowRight');
        setupMobileBtn('jumpBtn', ' ');
        setupMobileBtn('attackBtn', 'z');
        setupMobileBtn('specialBtn', 'x');

        function createParticle(x, y, color, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function updatePlayer(dt) {
            // Movement
            if (keys['ArrowLeft'] || keys['a']) {
                player.vx = -player.speed;
                player.facing = -1;
            } else if (keys['ArrowRight'] || keys['d']) {
                player.vx = player.speed;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            // Jump
            if ((keys[' '] || keys['ArrowUp'] || keys['w']) && player.onGround) {
                player.vy = -player.jumpPower;
                player.onGround = false;
                player.hasDoubleJumped = false;
                jumpSound();
                createParticle(player.x + player.width/2, player.y + player.height, '#00ffff', 8);
            } else if ((keys[' '] || keys['ArrowUp'] || keys['w']) && !player.onGround && !player.hasDoubleJumped) {
                player.vy = -player.jumpPower * 0.8;
                player.hasDoubleJumped = true;
                jumpSound();
                createParticle(player.x + player.width/2, player.y + player.height, '#ffff00', 8);
            }

            // Attack
            if ((keys['z']) && !player.attacking && player.energy >= 10) {
                player.attacking = true;
                player.attackTimer = 15;
                player.energy -= 10;
                attackSound();
                
                // Check hit
                enemies.forEach(enemy => {
                    if (Math.abs(player.x - enemy.x) < 80 && Math.abs(player.y - enemy.y) < 80) {
                        enemy.health -= 20 + level * 5;
                        hitSound();
                        createParticle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color, 10);
                        if (enemy.health <= 0) {
                            score += 100;
                            createParticle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ffff00', 20);
                        }
                    }
                });
            }

            // Special attack
            if ((keys['x']) && !player.specialAttacking && player.energy >= 50) {
                player.specialAttacking = true;
                player.specialTimer = 30;
                player.energy -= 50;
                specialSound();
                
                // Create projectile
                projectiles.push({
                    x: player.x + (player.facing > 0 ? player.width : 0),
                    y: player.y + player.height/2,
                    vx: player.facing * 12,
                    vy: 0,
                    size: 20,
                    damage: 50 + level * 10,
                    life: 60,
                    color: '#ff00ff',
                    type: 'special'
                });
            }

            // Apply gravity
            player.vy += 0.6;
            player.x += player.vx;
            player.y += player.vy;

            // Platform collision
            player.onGround = false;
            platforms.forEach(plat => {
                if (player.x + player.width > plat.x && player.x < plat.x + plat.width) {
                    if (player.y + player.height > plat.y && player.y + player.height < plat.y + plat.height && player.vy > 0) {
                        player.y = plat.y - player.height;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            });

            // Keep in bounds
            if (player.x < 0) player.x = 0;
            if (player.y > canvas.height) {
                player.health -= 20;
                player.x = cameraX + 100;
                player.y = 100;
                hitSound();
            }

            // Energy regen
            if (player.energy < player.maxEnergy) {
                player.energy += 0.2;
            }

            // Health regen
            if (player.health < player.maxHealth) {
                player.health += 0.05;
            }

            // Attack timers
            if (player.attacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.attacking = false;
            }
            if (player.specialAttacking) {
                player.specialTimer--;
                if (player.specialTimer <= 0) player.specialAttacking = false;
            }
            if (player.invincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) player.invincible = false;
            }

            // Animation
            player.animTimer++;
            if (player.animTimer > 8) {
                player.animTimer = 0;
                player.animFrame = (player.animFrame + 1) % 4;
            }

            // Camera
            const targetCameraX = player.x - canvas.width / 3;
            cameraX += (targetCameraX - cameraX) * 0.1;

            // Check death
            if (player.health <= 0) {
                lives--;
                if (lives <= 0) {
                    gameOver();
                } else {
                    player.health = player.maxHealth;
                    player.x = cameraX + 100;
                    player.y = 100;
                    player.invincible = true;
                    player.invincibleTimer = 120;
                }
            }

            // Update UI
            document.getElementById('healthFill').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('energyFill').style.width = (player.energy / player.maxEnergy * 100) + '%';
            document.getElementById('score').textContent = 'النقاط: ' + score;
            document.getElementById('level').textContent = 'المرحلة: ' + level;

            // Level complete
            if (enemies.length === 0) {
                levelComplete();
            }
        }

        function updateEnemies() {
            enemies.forEach((enemy, idx) => {
                if (enemy.health <= 0) {
                    createParticle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color, 15);
                    enemies.splice(idx, 1);
                    return;
                }

                // AI
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < 400) {
                    // Move towards player
                    if (Math.abs(dx) > 50) {
                        enemy.x += Math.sign(dx) * enemy.vx;
                    }
                    
                    // Attack if close
                    enemy.attackTimer++;
                    if (enemy.attackTimer > 60 && dist < 100) {
                        enemy.attackTimer = 0;
                        if (Math.abs(dx) < 60 && Math.abs(dy) < 60 && !player.invincible) {
                            player.health -= enemy.damage;
                            hitSound();
                            createParticle(player.x + player.width/2, player.y + player.height/2, '#ff0000', 5);
                            player.invincible = true;
                            player.invincibleTimer = 30;
                        }
                    }

                    // Firewall shoots
                    if (enemy.type === 'firewall' && enemy.attackTimer % 90 === 0) {
                        projectiles.push({
                            x: enemy.x + enemy.width/2,
                            y: enemy.y + enemy.height/2,
                            vx: Math.sign(dx) * 5,
                            vy: 0,
                            size: 10,
                            damage: 10,
                            life: 120,
                            color: '#ff4400',
                            type: 'enemy'
                        });
                    }
                }

                // Patrol
                else {
                    enemy.x += enemy.vx;
                }

                // Gravity for enemies
                let onPlat = false;
                platforms.forEach(plat => {
                    if (enemy.x + enemy.width > plat.x && enemy.x < plat.x + plat.width) {
                        if (enemy.y + enemy.height >= plat.y && enemy.y + enemy.height <= plat.y + 20) {
                            enemy.y = plat.y - enemy.height;
                            onPlat = true;
                        }
                    }
                });

                // Animation
                enemy.animTimer++;
                if (enemy.animTimer > 10) {
                    enemy.animTimer = 0;
                    enemy.animFrame = (enemy.animFrame + 1) % 4;
                }
            });
        }

        function updateProjectiles() {
            projectiles.forEach((proj, idx) => {
                proj.x += proj.vx;
                proj.y += proj.vy;
                proj.life--;

                if (proj.life <= 0) {
                    projectiles.splice(idx, 1);
                    return;
                }

                // Hit enemies
                if (proj.type === 'special' || proj.type === 'player') {
                    enemies.forEach(enemy => {
                        if (Math.abs(proj.x - enemy.x) < 40 && Math.abs(proj.y - enemy.y) < 40) {
                            enemy.health -= proj.damage;
                            hitSound();
                            createParticle(proj.x, proj.y, proj.color, 8);
                            if (proj.type === 'special') projectiles.splice(idx, 1);
                        }
                    });
                }

                // Hit player
                if (proj.type === 'enemy' && !player.invincible) {
                    if (Math.abs(proj.x - player.x) < 40 && Math.abs(proj.y - player.y) < 40) {
                        player.health -= proj.damage;
                        hitSound();
                        createParticle(player.x + player.width/2, player.y + player.height/2, '#ff0000', 5);
                        player.invincible = true;
                        player.invincibleTimer = 30;
                        projectiles.splice(idx, 1);
                    }
                }
            });
        }

        function updateParticles() {
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.3;
                p.life--;
                if (p.life <= 0) particles.splice(idx, 1);
            });
        }

        function updatePowerups() {
            powerups.forEach((p, idx) => {
                p.bobTimer += 0.05;
                p.y += Math.sin(p.bobTimer) * 0.5;

                if (!p.collected && Math.abs(player.x - p.x) < 50 && Math.abs(player.y - p.y) < 50) {
                    p.collected = true;
                    playSound(800, 0.2, 'sine', 0.15);
                    if (p.type === 'health') {
                        player.health = Math.min(player.maxHealth, player.health + 50);
                    } else if (p.type === 'energy') {
                        player.energy = player.maxEnergy;
                    } else if (p.type === 'life') {
                        lives++;
                    }
                    createParticle(p.x, p.y, '#ffff00', 15);
                    powerups.splice(idx, 1);
                }
            });
        }

        function drawBackground() {
            // Stars
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 100; i++) {
                const x = (i * 137 + cameraX * 0.2) % canvas.width;
                const y = (i * 91) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Distant city silhouette
            ctx.fillStyle = '#1a0033';
            for (let i = 0; i < 20; i++) {
                const x = (i * 200 - cameraX * 0.3) % (canvas.width + 200) - 100;
                const h = 80 + (i % 5) * 30;
                ctx.fillRect(x, canvas.height - 50 - h, 80, h);
            }
        }

        function drawPlayer() {
            const sx = player.x - cameraX;
            const sy = player.y;
            
            if (player.invincible && Math.floor(player.invincibleTimer / 4) % 2 === 0) return;

            ctx.save();
            ctx.translate(sx + player.width/2, sy + player.height/2);
            if (player.facing < 0) ctx.scale(-1, 1);

            // Body
            const bodyColor = player.invincible ? '#ffff00' : '#00ffff';
            ctx.fillStyle = bodyColor;
            ctx.shadowColor = bodyColor;
            ctx.shadowBlur = 20;
            
            // Helmet
            ctx.fillRect(-20, -35, 40, 25);
            ctx.fillStyle = '#000';
            ctx.fillRect(-15, -28, 12, 8);
            ctx.fillRect(3, -28, 12, 8);

            // Body
            ctx.fillStyle = '#0066ff';
            ctx.fillRect(-22, -10, 44, 35);
            
            // Armor detail
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-5, -5, 10, 25);
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(-3, 0, 6, 6);

            // Arms
            ctx.fillStyle = '#00ffff';
            if (player.attacking) {
                // Attack animation
                ctx.fillRect(20, -10, 30, 12);
                // Energy slash
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ffff00';
                ctx.beginPath();
                ctx.arc(45, 0, 25, -Math.PI/3, Math.PI/3);
                ctx.stroke();
            } else {
                ctx.fillRect(20, -5, 12, 25);
            }
            ctx.fillRect(-32, -5, 12, 25);

            // Legs
            ctx.fillStyle = '#003399';
            const legOffset = player.onGround ? Math.sin(player.animFrame * Math.PI / 2) * 5 : 3;
            ctx.fillRect(-18, 25, 14, 12 + legOffset);
            ctx.fillRect(4, 25, 14, 12 - legOffset);

            // Special attack aura
            if (player.specialAttacking) {
                ctx.strokeStyle = '#ff00ff';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff00ff';
                ctx.beginPath();
                ctx.arc(0, 0, 50, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                const sx = enemy.x - cameraX;
                const sy = enemy.y;

                ctx.save();
                ctx.translate(sx + enemy.width/2, sy + enemy.height/2);

                // Body
                ctx.fillStyle = enemy.color;
                ctx.shadowColor = enemy.color;
                ctx.shadowBlur = 15;

                if (enemy.type === 'robot') {
                    // Robot
                    ctx.fillRect(-20, -25, 40, 50);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-12, -18, 8, 8);
                    ctx.fillRect(4, -18, 8, 8);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-10, -16, 4, 4);
                    ctx.fillRect(6, -16, 4, 4);
                } else if (enemy.type === 'virus') {
                    // Virus (spiky)
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2 + enemy.animFrame * 0.2;
                        const r = 20 + Math.sin(enemy.animFrame * 0.5) * 3;
                        ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#003300';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'firewall') {
                    // Firewall (flame shape)
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.quadraticCurveTo(25, -10, 20, 25);
                    ctx.quadraticCurveTo(0, 35, -20, 25);
                    ctx.quadraticCurveTo(-25, -10, 0, -30);
                    ctx.fill();
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fill();
                } else if (enemy.type === 'trojan') {
                    // Trojan (horse-like)
                    ctx.fillRect(-22, -20, 44, 40);
                    ctx.fillRect(-22, -30, 35, 15);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(-8, -15, 5, 5);
                    ctx.fillRect(8, -15, 5, 5);
                }

                // Health bar
                ctx.fillStyle = '#000';
                ctx.fillRect(-25, -40, 50, 6);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-24, -39, 48 * (enemy.health / enemy.maxHealth), 4);

                ctx.restore();
            });
        }

        function drawPlatforms() {
            platforms.forEach(plat => {
                const sx = plat.x - cameraX;
                if (sx + plat.width < 0 || sx > canvas.width) return;

                ctx.fillStyle = plat.color;
                ctx.shadowColor = plat.color;
                ctx.shadowBlur = 10;
                
                if (plat.type === 'ground') {
                    // Cyber ground
                    ctx.fillRect(sx, plat.y, plat.width, plat.height);
                    ctx.fillStyle = '#00ffff';
                    for (let i = 0; i < plat.width; i += 30) {
                        ctx.fillRect(sx + i, plat.y, 15, 2);
                    }
                } else {
                    // Platform
                    ctx.fillRect(sx, plat.y, plat.width, plat.height);
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(sx, plat.y, plat.width, 2);
                    // Tech detail
                    ctx.fillStyle = '#ff00ff';
                    ctx.fillRect(sx + 5, plat.y + 8, 8, 4);
                    ctx.fillRect(sx + plat.width - 13, plat.y + 8, 8, 4);
                }
            });
        }

        function drawProjectiles() {
            projectiles.forEach(proj => {
                const sx = proj.x - cameraX;
                ctx.fillStyle = proj.color;
                ctx.shadowColor = proj.color;
                ctx.shadowBlur = 20;
                
                if (proj.type === 'special') {
                    // Energy ball
                    ctx.beginPath();
                    ctx.arc(sx, proj.y, proj.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx, proj.y, proj.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Fireball
                    ctx.beginPath();
                    ctx.arc(sx, proj.y, proj.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.fillRect(p.x - cameraX, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1;
        }

        function drawPowerups() {
            powerups.forEach(p => {
                const sx = p.x - cameraX;
                ctx.save();
                ctx.translate(sx + p.width/2, p.y + p.height/2);
                ctx.rotate(Math.sin(p.bobTimer * 2) * 0.2);

                if (p.type === 'health') {
                    ctx.fillStyle = '#ff0000';
                    ctx.shadowColor = '#ff0000';
                } else if (p.type === 'energy') {
                    ctx.fillStyle = '#00ffff';
                    ctx.shadowColor = '#00ffff';
                } else {
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowColor = '#ffff00';
                }
                ctx.shadowBlur = 15;
                
                // Cross shape
                ctx.fillRect(-3, -12, 6, 24);
                ctx.fillRect(-12, -3, 24, 6);
                
                ctx.restore();
            });
        }

        function drawHUD() {
            // Lives
            ctx.fillStyle = '#ff0000';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 10;
            ctx.font = 'bold 30px Courier New';
            for (let i = 0; i < lives; i++) {
                ctx.fillText('❤', canvas.width - 80 - i * 35, 50);
            }
            ctx.shadowBlur = 0;
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing' && gameState !== 'complete' && gameState !== 'gameover') return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // Clear
            ctx.fillStyle = '#0a0a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'playing') {
                updatePlayer(dt);
                updateEnemies();
                updateProjectiles();
                updateParticles();
                updatePowerups();
            }

            // Draw
            drawBackground();
            drawPlatforms();
            drawPowerups();
            drawEnemies();
            drawPlayer();
            drawProjectiles();
            drawParticles();
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start screen background animation
        function animateBackground() {
            if (gameState === 'start') {
                ctx.fillStyle = '#0a0a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawBackground();
                requestAnimationFrame(animateBackground);
            }
        }
        animateBackground();
    </script>
</body>
</html>
